<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L’Austral Burger · Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,900;1,500&family=Special+Elite&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3e9d8;--ink:#2a0a0d;--mut:#7a5a55;--red:#8c1420;--card:#fffaf0;--line:#c9b79c;--glow:rgba(140,20,32,.25);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150809;--ink:#f6ead8;--mut:#b99a92;--red:#d2283a;--card:#240d10;--line:#4a2226;--glow:rgba(210,40,58,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150809;--ink:#f6ead8;--mut:#b99a92;--red:#d2283a;--card:#240d10;--line:#4a2226;--glow:rgba(210,40,58,.35);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px)}
body{background:var(--bg);color:var(--ink);font-family:Oswald,"Arial Narrow",sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.serif{font-family:"Playfair Display",Georgia,serif;font-style:italic}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
/* hero */
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;position:relative;background:radial-gradient(ellipse at 50% 30%,var(--glow),transparent 65%)}
.neon{font-size:clamp(46px,15vw,84px);line-height:.95;color:var(--ink);text-shadow:0 0 18px var(--glow)}
.sub{letter-spacing:.45em;font-size:15px;margin-top:10px;color:var(--red);font-weight:600}
.lead{max-width:300px;margin:22px auto 30px;color:var(--mut);font-size:16px;line-height:1.5;font-weight:400}
.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;padding:15px 34px;border-radius:50px;letter-spacing:.2em;font-size:15px;font-weight:500;box-shadow:0 8px 30px var(--glow)}
.hint{position:absolute;bottom:24px;font-size:12px;letter-spacing:.3em;color:var(--mut);animation:b 2s infinite}
@keyframes b{50%{transform:translateY(7px)}}
/* top bar */
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);font-size:13px;letter-spacing:.2em;transform:translateY(-120%);transition:.3s}
#bar.on{transform:none}
#bar b{color:var(--red);font-weight:600}
#prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--red);width:0}
/* journey */
main{position:relative;padding:100px 20px 60px 56px;max-width:640px;margin:auto}
#rail{position:absolute;left:26px;top:0;bottom:0;width:0;border-left:2px dashed var(--line)}
.stop{margin:0 0 70px;opacity:0;transform:translateY(30px);transition:.7s}
.stop.in{opacity:1;transform:none}
.num{position:absolute;left:-46px;margin-top:6px;width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:600;box-shadow:0 0 0 5px var(--bg)}
.stop{position:relative}
.stop h2{font-size:clamp(38px,11vw,54px);line-height:1;letter-spacing:.06em;font-weight:600;text-transform:uppercase}
.tag{font-size:19px;color:var(--red);margin:6px 0 20px}
.item{padding:13px 0;border-bottom:1px dotted var(--line)}
.row{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.nm{font-size:19px;letter-spacing:.04em;font-weight:500}
.pr{font-size:19px;color:var(--red);font-weight:600;white-space:nowrap}
.pr small{font-size:12px;margin-left:2px}
.ds{font-family:system-ui,sans-serif;font-size:13.5px;line-height:1.45;color:var(--mut);margin-top:3px;text-transform:none}
.item.star .nm::after{content:" ★";color:var(--red)}
.note{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.pill{border:1.5px solid var(--red);color:var(--red);border-radius:40px;padding:7px 16px;font-size:14px;letter-spacing:.1em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 18px;margin-bottom:18px}
.card h3{font-size:14px;letter-spacing:.35em;color:var(--red);padding:14px 0 2px;font-weight:600}
.card .item:last-child{border:0}
.pair{display:grid;gap:0 18px}
/* finale */
.end{text-align:center;padding:70px 24px 90px;background:radial-gradient(ellipse at 50% 100%,var(--glow),transparent 70%)}
.end .neon{font-size:44px}
.spots{display:flex;flex-direction:column;gap:10px;margin:26px auto 0;max-width:300px}
.spots div{border:1.5px solid var(--line);border-radius:12px;padding:12px;letter-spacing:.15em;font-size:14px}
.spots span{display:block;color:var(--mut);font-size:12px;letter-spacing:.2em;margin-top:2px}
.end p{margin-top:30px;color:var(--mut);font-size:13px;letter-spacing:.2em}
.art{margin:0 0 70px;opacity:0;transform:translateY(30px) rotate(0);transition:.9s;position:relative}
.art.in{opacity:1;transform:rotate(var(--r))}
.art.r0{--r:-1.6deg}.art.r1{--r:1.6deg}
.art .fr{background:var(--card);border:9px solid #111;outline:1px solid var(--line);padding:9px;box-shadow:0 18px 40px rgba(0,0,0,.35);position:relative;width:88%;margin:auto}
.art.w .fr{width:100%}
.art img{display:block;width:100%;max-height:68vh;object-fit:cover;filter:grayscale(1) contrast(1.05)}
.art .fr::after{content:"";position:absolute;inset:9px;background:linear-gradient(160deg,transparent 55%,var(--glow));pointer-events:none;mix-blend-mode:multiply}
.art figcaption{text-align:center;color:var(--red);font-size:19px;margin-top:16px}
.art figcaption::before{content:"— ";}.art figcaption::after{content:" —"}
.hero{overflow:hidden}
.neon,.sub,.lead,.btn,.cats{position:relative;z-index:2}
#col{position:absolute;inset:0;z-index:0;overflow:hidden;opacity:.6;transition:transform 1.3s cubic-bezier(.6,0,.9,.5),filter 1.3s,opacity 1.3s}
#col::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 10%,var(--bg) 88%)}
#col img{position:absolute;height:auto;border:6px solid #111;filter:grayscale(1) blur(5px);transform:rotate(var(--r));animation:dr 14s ease-in-out infinite alternate}
@keyframes dr{to{transform:rotate(var(--r)) translateY(-20px) scale(1.07)}}

.go #col{transform:scale(3.2);filter:blur(12px);opacity:.95}
.go .neon,.go .sub,.go .lead,.go .btn,.go .hint,.go .cats{opacity:0;transform:scale(1.7);transition:.7s}
#app{display:none;position:relative;z-index:1}
body.ent .hero{display:none}
body.ent #app{display:block;animation:inh 1.1s both}
@keyframes inh{from{opacity:0;filter:blur(10px)}to{opacity:1;filter:none}}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;display:none}
body.ent #bg{display:block}
#bg i{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:grayscale(1) blur(16px);opacity:0;transition:opacity 1.4s}
#bg i.on{opacity:.32}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(color-mix(in srgb,var(--bg) 50%,transparent),var(--bg) 95%)}
.cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:340px;margin:0 auto 26px}
.cats button{font:inherit;background:color-mix(in srgb,var(--card) 80%,transparent);color:var(--ink);border:1.5px solid var(--line);border-radius:30px;padding:9px 14px;font-size:14px;letter-spacing:.1em;backdrop-filter:blur(6px);cursor:pointer}
.cats button b{color:var(--red);margin-right:4px}
#home{font:inherit;background:none;border:0;color:var(--ink);letter-spacing:.2em;font-size:13px;padding:6px 0;cursor:pointer}
body.ent{--bg:#efe2c6;--ink:#2b1a12;--mut:#6b5443;--red:#8a1c20;--card:#f7ecd3;--line:#b79f78;--glow:rgba(138,28,32,.18);color-scheme:light}
body.ent #bg i{filter:sepia(.9) contrast(1.1) blur(5px);mix-blend-mode:multiply}
body.ent #bg i.on{opacity:.34}
body.ent #bg::after{background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .22 0 0 0 0 .1 0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),linear-gradient(color-mix(in srgb,var(--bg) 55%,transparent),color-mix(in srgb,var(--bg) 90%,transparent));box-shadow:inset 0 0 150px rgba(90,50,20,.45)}
.stop h2{font-family:"Playfair Display",Georgia,serif;font-weight:900;font-style:normal;letter-spacing:.07em;border-bottom:3px double var(--ink);padding-bottom:8px}
.tag{margin-top:10px}
.nm{font-family:"Playfair Display",Georgia,serif;font-weight:600;letter-spacing:.02em;font-size:20px}
.pr{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600}
.ds{font-family:"Special Elite","Courier New",monospace;font-size:12.5px;line-height:1.5}
.item{border-bottom:1px dotted var(--ink)}
.num{margin-top:56px;background:var(--bg);color:var(--red);border:2px solid var(--red);box-shadow:inset 0 0 0 3px var(--bg),inset 0 0 0 4px var(--red),0 0 0 5px var(--bg)}
.card{border:3px double var(--ink);background:var(--card);box-shadow:3px 4px 0 rgba(43,26,18,.2)}
.ban{margin:0 0 18px;padding:5px;background:var(--card);border:1px solid var(--ink);outline:1px solid var(--ink);outline-offset:3px;box-shadow:3px 5px 0 rgba(43,26,18,.25);transform:rotate(-.6deg)}
.stop:nth-of-type(even) .ban{transform:rotate(.6deg)}
.ban img{display:block;width:100%;height:150px;object-fit:cover;filter:sepia(.8) contrast(1.12) brightness(.95)}
.pill{background:var(--card)}
#bar{border-bottom:3px double var(--ink)}
body.ent{--bg:#5c0e14;--ink:#f7ecdb;--mut:#dcbdb1;--red:#f0c98a;--card:#6c141b;--line:#a0555a;--glow:rgba(0,0,0,.25);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .22 0 0 0 0 .1 0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body.ent .item{border-bottom:1px dotted rgba(247,236,219,.35)}
body.ent .btn{color:#3b0a0e}
body.ent .card,body.ent #bar{border-color:rgba(247,236,219,.7)}
body.ent #bar{border-bottom:3px double rgba(247,236,219,.7)}
body.ent .stop h2{border-bottom-color:rgba(247,236,219,.7)}
.stop h2{font-size:clamp(24px,7.4vw,36px);letter-spacing:.04em;line-height:1.1;padding-bottom:10px}
.tag{font-size:17px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>

function enter(e){if(e)e.preventDefault();go(0)}
